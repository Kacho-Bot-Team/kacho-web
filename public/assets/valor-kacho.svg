<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>Proyección fija con 1,000 consultas: de 500 a 900 atendidas, de 150 a 270 cotizaciones y de 30 a 54 ventas estimadas.</title><rect x="1" y="1" width="1198" height="858" rx="24" fill="#fffcf7" stroke="#ddd2c7"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ac3d12" text-anchor="start">PROYECCIÓN ILUSTRATIVA · UN MISMO MES</text><text x="48" y="106" font-family="Arial, sans-serif" font-size="43" font-weight="600" fill="#2b231f" text-anchor="start">Las mismas 1,000 consultas.</text><text x="48" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#706257" text-anchor="start">Más atención puede abrir más oportunidades de venta.</text><path d="M48 181H1152" stroke="#ddd2c7"/><text x="385" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#706257" text-anchor="middle">ATENCIÓN</text><text x="690" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#706257" text-anchor="middle">COTIZACIÓN</text><text x="995" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#706257" text-anchor="middle">CIERRE</text><text x="48" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#706257" text-anchor="start">Punto de partida</text><text x="48" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#706257" text-anchor="start">50% de cobertura</text><rect x="25" y="348" width="1150" height="111" rx="12" fill="#f9e5d1"/><text x="48" y="392" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ac3d12" text-anchor="start">Mayor cobertura</text><text x="48" y="421" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#ac3d12" text-anchor="start">90% de las consultas</text><text x="385" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#8e7d69" text-anchor="middle">500</text><text x="385" y="423" font-family="Arial, sans-serif" font-size="58" font-weight="600" fill="#ac3d12" text-anchor="middle">900</text><text x="385" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="600" fill="#ac3d12" text-anchor="middle">+400</text><text x="385" y="557" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#706257" text-anchor="middle">consultas atendidas</text><text x="690" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#8e7d69" text-anchor="middle">150</text><text x="690" y="423" font-family="Arial, sans-serif" font-size="58" font-weight="600" fill="#ac3d12" text-anchor="middle">270</text><text x="690" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="600" fill="#ac3d12" text-anchor="middle">+120</text><text x="690" y="557" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#706257" text-anchor="middle">cotizaciones posibles</text><text x="995" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#8e7d69" text-anchor="middle">30</text><text x="995" y="423" font-family="Arial, sans-serif" font-size="58" font-weight="600" fill="#ac3d12" text-anchor="middle">54</text><text x="995" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="600" fill="#ac3d12" text-anchor="middle">+24</text><text x="995" y="557" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#706257" text-anchor="middle">ventas estimadas</text><path d="M467 290H588m-7-6 7 6-7 6" fill="none" stroke="#c4ad94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M772 290H894m-7-6 7 6-7 6" fill="none" stroke="#c4ad94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M467 400H588m-7-6 7 6-7 6" fill="none" stroke="#c4ad94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M772 400H894m-7-6 7 6-7 6" fill="none" stroke="#c4ad94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="middle">30% cotiza</text><text x="835" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="middle">20% cierra</text><text x="48" y="519" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#2b231f" text-anchor="start">La diferencia</text><text x="48" y="546" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#706257" text-anchor="start">con estos supuestos</text><path d="M48 595H1152" stroke="#ddd2c7"/><text x="48" y="630" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#ac3d12" text-anchor="start">POR QUÉ PUEDE AVANZAR LA VENTA</text><circle cx="62" cy="666" r="14" fill="#efe6d9"/><text x="62" y="671" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ac3d12" text-anchor="middle">01</text><text x="86" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2b231f" text-anchor="start">Atención que da continuidad.</text><text x="48" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">El asistente reúne la necesidad</text><text x="48" y="734" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">mientras el equipo atiende otras ventas.</text><circle cx="444" cy="666" r="14" fill="#efe6d9"/><text x="444" y="671" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ac3d12" text-anchor="middle">02</text><text x="468" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2b231f" text-anchor="start">Una propuesta preparada.</text><text x="430" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">Confirma los datos necesarios</text><text x="430" y="734" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">y prepara una cotización compartible.</text><circle cx="826" cy="666" r="14" fill="#efe6d9"/><text x="826" y="671" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ac3d12" text-anchor="middle">03</text><text x="850" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2b231f" text-anchor="start">Un asesor con contexto.</text><text x="812" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">Retoma la oportunidad, revisa</text><text x="812" y="734" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#706257" text-anchor="start">condiciones y acompaña la decisión.</text><rect x="25" y="765" width="1150" height="70" rx="10" fill="#f1ece3"/><text x="44" y="793" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#706257" text-anchor="start">Supuestos fijos: 1,000 consultas, 30% de atendidas a cotización y 20% de cotizaciones a venta.</text><text x="44" y="817" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#706257" text-anchor="start">Solo cambia la cobertura. Son estimaciones ilustrativas, no resultados medidos ni garantizados.</text></svg>