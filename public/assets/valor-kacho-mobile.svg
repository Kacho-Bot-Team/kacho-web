<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" role="img"><title>Proyección fija con 1,000 consultas: de 500 a 900 atendidas, de 150 a 270 cotizaciones y de 30 a 54 ventas estimadas.</title><rect x="1" y="1" width="358" height="1098" rx="24" fill="#fffcf7" stroke="#ddd2c7"/><text x="20" y="31" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ac3d12" text-anchor="start">PROYECCIÓN ILUSTRATIVA · UN MES</text><text x="20" y="72" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#2b231f" text-anchor="start">Las mismas</text><text x="20" y="106" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#2b231f" text-anchor="start">1,000 consultas.</text><text x="20" y="139" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#706257" text-anchor="start">Más atención, más oportunidades.</text><path d="M20 158H340" stroke="#ddd2c7"/><text x="20" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#ac3d12" text-anchor="start">01 / ATENCIÓN</text><text x="89" y="216" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Punto de partida</text><text x="268" y="216" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Mayor cobertura</text><rect x="194" y="227" width="146" height="70" rx="10" fill="#f9e5d1"/><text x="89" y="277" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="#8e7d69" text-anchor="middle">500</text><text x="268" y="277" font-family="Arial, sans-serif" font-size="44" font-weight="600" fill="#ac3d12" text-anchor="middle">900</text><path d="M163 261H187m-7-6 7 6-7 6" fill="none" stroke="#baa287" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="330" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ac3d12" text-anchor="start">+400 consultas atendidas</text><text x="20" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#706257" text-anchor="start">50% → 90% de cobertura.</text><text x="20" y="382" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">Reúne la necesidad mientras tu equipo</text><text x="20" y="402" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">atiende otras ventas.</text><path d="M20 420H340" stroke="#ddd2c7"/><text x="20" y="433" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#ac3d12" text-anchor="start">02 / COTIZACIÓN</text><text x="89" y="462" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Punto de partida</text><text x="268" y="462" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Mayor cobertura</text><rect x="194" y="473" width="146" height="70" rx="10" fill="#f9e5d1"/><text x="89" y="523" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="#8e7d69" text-anchor="middle">150</text><text x="268" y="523" font-family="Arial, sans-serif" font-size="44" font-weight="600" fill="#ac3d12" text-anchor="middle">270</text><path d="M163 507H187m-7-6 7 6-7 6" fill="none" stroke="#baa287" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="576" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ac3d12" text-anchor="start">+120 cotizaciones posibles</text><text x="20" y="602" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#706257" text-anchor="start">El 30% de las atendidas llega a cotizar.</text><text x="20" y="628" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">Confirma datos y prepara una</text><text x="20" y="648" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">cotización compartible.</text><path d="M20 666H340" stroke="#ddd2c7"/><text x="20" y="679" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#ac3d12" text-anchor="start">03 / CIERRE</text><text x="89" y="708" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Punto de partida</text><text x="268" y="708" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#706257" text-anchor="middle">Mayor cobertura</text><rect x="194" y="719" width="146" height="70" rx="10" fill="#f9e5d1"/><text x="89" y="769" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="#8e7d69" text-anchor="middle">30</text><text x="268" y="769" font-family="Arial, sans-serif" font-size="44" font-weight="600" fill="#ac3d12" text-anchor="middle">54</text><path d="M163 753H187m-7-6 7 6-7 6" fill="none" stroke="#baa287" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="822" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ac3d12" text-anchor="start">+24 ventas estimadas</text><text x="20" y="848" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#706257" text-anchor="start">El 20% de las cotizaciones cierra.</text><text x="20" y="874" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">Tu asesor retoma el contexto y</text><text x="20" y="894" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b231f" text-anchor="start">acompaña la decisión del cliente.</text><path d="M20 912H340" stroke="#ddd2c7"/><rect x="14" y="930" width="332" height="151" rx="10" fill="#f1ece3"/><text x="27" y="957" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#ac3d12" text-anchor="start">SUPUESTOS FIJOS</text><text x="27" y="979" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="start">Solo cambia la cobertura de atención.</text><text x="27" y="996" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="start">El volumen y las tasas de conversión</text><text x="27" y="1013" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="start">se mantienen en ambos escenarios.</text><text x="27" y="1047" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="start">Estimaciones ilustrativas; no son</text><text x="27" y="1064" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#706257" text-anchor="start">resultados medidos ni garantizados.</text></svg>